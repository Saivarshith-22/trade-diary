<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div><h1>Trade Journal</h1><p class="subtitle">A simple journal to record and review your trades.</p></div>
    </header>

    <section class="stats">
      <article class="stat"><span>Total Trades:</span><strong id="totalTrades">0</strong></article>
      <article class="stat"><span>Wins:</span><strong id="wins">0</strong></article>
      <article class="stat"><span>Losses:</span><strong id="losses">0</strong></article>
      <article class="stat"><span>Win Rate:</span><strong id="winRate">0%</strong></article>
      <article class="stat"><span>Total P/L:</span><strong id="totalPL">0.00</strong></article>
    </section>

    <section class="panel">
      <h2>Add a trade</h2>
      <form id="tradeForm">
        <div class="form-grid">
          <label>Date<input id="date" type="date" required></label>
          <label>Symbol / Pair<input id="symbol" type="text" placeholder="e.g. RELIANCE, XAUUSD, EURUSD" required></label>
          <label>Direction<select id="direction" required><option value="Buy">Buy</option><option value="Sell">Sell</option></select></label>
          <label>Entry Price<input id="entry" type="number" step="any" min="0" required></label>
          <label>Exit Price<input id="exit" type="number" step="any" min="0" required></label>
          <label>Quantity<input id="quantity" type="number" step="any" min="0.000001" placeholder="Shares / units / lots" required></label>
          <label class="full">Notes<textarea id="notes" rows="2" placeholder="Reason for entry, mistakes, lessons..."></textarea></label>
        </div>
        <p class="calculation"></p>
        <button type="submit">Save Trade</button>
        <p id="message" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <div class="table-heading"><h2>Trade history</h2><input id="search" type="search" placeholder="Search symbol or notes"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>Quantity</th><th>P/L</th><th>Notes</th><th></th></tr></thead>
          <tbody id="tradeRows"><tr><td colspan="9" class="empty">Loading trades...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
